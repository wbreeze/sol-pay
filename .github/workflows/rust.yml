# Locked builds and tests for the Rust side: the on-chain program and the
# WASM client. Everything here runs against the committed Cargo.lock files, so
# a green run means those exact versions build and pass — no reader has to
# verify a pin by hand. Upstream drift is a separate, scheduled concern; see
# dependency-drift.yml.
name: rust

on:
  push:
    branches: [master, client]
    paths: ['pay-on-chain/**', 'wasm-client/**', 'bin/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['pay-on-chain/**', 'wasm-client/**', 'bin/**', '.github/workflows/rust.yml']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  client:
    name: wasm-client (locked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Run this *in wasm-client*, so rustup reads its rust-toolchain.toml and
      # adds the target to the pinned toolchain rather than to the runner's
      # default. This job survived the root-level spelling only because
      # wasm-pack runs its own `rustup target add` from inside the crate; that
      # is a repair we should not be depending on.
      - name: Add wasm target
        working-directory: wasm-client
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm-client

      # The default feature set is empty, so this is the UI-agnostic core
      # tested natively, without wasm-bindgen. The browser bundle step below
      # is what compiles the wasm layer.
      - name: Test core
        working-directory: wasm-client
        run: cargo test --locked

      # One generation of the solana crates, or two copies of solana-pubkey
      # end up in the tree. This is the check that keeps the README's note
      # from being something anyone has to remember.
      - name: No duplicate solana crates
        working-directory: wasm-client
        run: |
          dupes="$(cargo tree --locked -d -e normal | grep -E '^solana-' || true)"
          if [ -n "$dupes" ]; then
            echo "Duplicate solana crates in the dependency tree:"
            echo "$dupes"
            exit 1
          fi

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build browser bundle
        run: ./bin/build-rust --client

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-client-pkg
          path: wasm-client/pkg/
          retention-days: 7

  program:
    name: pay-on-chain (locked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # prefix-key bumped once, deliberately: a run before the Solana
      # tooling pin below cached ~/.cargo/bin and this job's target/ under
      # the old key, and Swatinem/rust-cache restored that stale cache into
      # a run that otherwise had the fix, producing a confusing, different
      # failure than the one being fixed. This forces one clean cache;
      # revert to the plain default once that's landed and confirmed.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pay-on-chain
          prefix-key: v1-rust

      # Pinned rather than "stable": stable currently resolves to a release
      # whose default platform-tools (v1.51) bundles rustc 1.84, which
      # cannot parse any dependency's Cargo.toml that requires the
      # edition2024 feature -- a growing set as of 2026 (zeroize, blake3,
      # rand, indexmap, the toml crates, and more, none of which this repo
      # depends on directly). v3.1.14's default platform-tools (v1.52)
      # bundles rustc 1.89, which does not have this problem. Move this
      # forward deliberately, the same way bin/update-locks treats a lock
      # bump: never silently, and re-run `anchor build` locally first.
      - name: Install Solana tooling
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.14/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # Diagnostic, not decoration: a prior run failed inside `anchor build`
      # with rustc 1.84 despite this job installing v3.1.14 above, printing
      # an unexplained "2.3.0 initialized" line first. Neither anchor's nor
      # cargo-build-sbf's source (checked directly) has a code path that
      # would produce that from anything in this repo, so if it recurs this
      # step pins down what's actually active before `anchor build` obscures
      # it inside a much longer log.
      - name: Report SBF toolchain
        run: cargo build-sbf --version

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --locked --force
          avm install 0.32.1
          avm use 0.32.1

      # The LiteSVM harness loads target/deploy/pay_on_chain.so, so the
      # program has to exist before the tests run.
      - name: Build program
        run: ./bin/build-rust --program

      # Program behaviour plus the client/program parity checks.
      - name: Test
        working-directory: pay-on-chain
        run: cargo test --locked
