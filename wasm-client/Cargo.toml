[package]
name = "sol-pay-client"
version = "0.1.0"
edition = "2021"
description = "Instruction builders for the pay-on-chain metering program, usable from WASM or native Rust"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# `core` carries the whole client and depends on nothing UI- or
# browser-specific, so a Leptos/Yew front end (or a native tool, or a test)
# can use it directly. The wasm-bindgen layer in lib.rs is a thin wrapper and
# is the only part that knows it is running in a browser.
[features]
default = ["wasm"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:serde", "dep:serde_bytes"]

[dependencies]
# Pinned to the solana 2.x crate generation on purpose: anchor-lang 0.32.1,
# litesvm and spl-token are all on 2.x, and the parity test in
# pay-on-chain/tests builds this crate alongside them. Mixing generations puts
# two copies of the same crate in one tree and fails to compile.
solana-pubkey = { version = "2.4", default-features = false, features = ["curve25519", "std"] }
solana-instruction = { version = "2.3", default-features = false, features = ["std"] }
borsh = { version = "1.5", features = ["derive"] }
bs58 = "0.5"

wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_bytes = { version = "0.11", optional = true }

[dev-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
