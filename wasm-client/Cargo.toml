[package]
name = "sol-pay-client"
version = "0.1.0"
edition = "2021"
description = "Instruction builders for the pay-on-chain metering program, usable from WASM or native Rust"
license = "MIT"
repository = "https://github.com/wbreeze/sol-pay"
readme = "README.md"
keywords = ["solana", "wasm", "payments", "micropayments", "anchor"]
categories = ["cryptography::cryptocurrencies", "wasm", "api-bindings"]
# What the toolchain file pins and CI actually runs. Not a claim that older
# compilers fail -- nobody has tried one, and an untested floor is the kind of
# version fact this repo keeps out of prose.
rust-version = "1.89"
# Build output. Cargo already skips gitignored paths when packaging from a
# git checkout; this makes it true regardless of how the package is built.
exclude = ["pkg/", "target/", "SPEC.pdf"]

# docs.rs builds with default features, which now means the browser surface
# would be absent from the rendered documentation. Ask for it, on the target
# it belongs to.
[package.metadata.docs.rs]
features = ["wasm"]
default-target = "wasm32-unknown-unknown"

[lib]
crate-type = ["cdylib", "rlib"]

# `core` carries the whole client and depends on nothing UI- or
# browser-specific, so a Leptos/Yew front end (or a native tool, or a test)
# can use it directly. The wasm-bindgen layer in lib.rs is a thin wrapper and
# is the only part that knows it is running in a browser.
#
# So `wasm` is opt-in rather than default: a site's Rust server depends on
# this crate for `core` alone, and a default-on wasm feature would drag
# wasm-bindgen and three serde crates into that build for nothing. Whatever
# wants the browser bundle asks for the feature by name -- see bin/build-rust.
[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:serde", "dep:serde_bytes"]

[dependencies]
# Pinned to the solana 2.x crate generation on purpose: anchor-lang 0.32.1,
# litesvm and spl-token are all on 2.x, and the parity test in
# pay-on-chain/tests builds this crate alongside them. Mixing generations puts
# two copies of the same crate in one tree and fails to compile.
solana-pubkey = { version = "2.4", default-features = false, features = ["curve25519", "std"] }
solana-instruction = { version = "2.3", default-features = false, features = ["std"] }
borsh = { version = "1.5", features = ["derive"] }
bs58 = "0.5"

wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_bytes = { version = "0.11", optional = true }

[dev-dependencies]
sha2 = "0.10"

# Ignored by consumers of the published crate -- Cargo takes profiles from the
# top-level workspace only -- but it is what `wasm-pack build` uses here, and
# bundle size is the whole reason for the hand-rolled SPL instructions.
[profile.release]
opt-level = "s"
lto = true

# Same intent, one layer down: wasm-pack runs wasm-opt over the output, and
# its default is -O. Match the size-first choice above.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]
